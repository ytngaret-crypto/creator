<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROOM_2238</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06091b;color:#d9b8ff;font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(ellipse at 30% 25%,rgba(81,70,170,.32),transparent 38%),radial-gradient(ellipse at 75% 70%,rgba(104,45,150,.22),transparent 42%),linear-gradient(145deg,#070a24,#10133b 50%,#09071c)}
#stars{position:fixed;inset:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.35;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:1;transform:scale(1.8)}}
.nebula{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(55px);opacity:.18;animation:drift 12s ease-in-out infinite alternate}
.n1{left:-15vw;top:-10vw;background:#6475ff}.n2{right:-18vw;bottom:-15vw;background:#b45cff}
@keyframes drift{to{transform:translate3d(4vw,-3vh,0) scale(1.08)}}
#app{position:fixed;inset:0}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene.active{opacity:1;pointer-events:auto}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;color:rgba(205,174,255,.72);font:9px ui-monospace,monospace;letter-spacing:.18em}
#enter{position:absolute;z-index:20;bottom:36px;left:50%;transform:translateX(-50%);padding:12px 20px;border:1px solid rgba(215,210,255,.4);border-radius:999px;background:rgba(8,10,31,.72);color:#d9b8ff;font:10px ui-monospace,monospace;letter-spacing:.18em}
#intro .title{font:clamp(30px,9vw,78px) ui-monospace,monospace;letter-spacing:-.08em}
#intro .sub{margin-top:12px;text-align:center;color:rgba(194,158,255,.68);font-size:10px;letter-spacing:.18em}
#textScene{padding:20px}
#memoryText{max-width:86vw;text-align:center;font-size:clamp(24px,7vw,54px);line-height:1.12;letter-spacing:-.045em;text-shadow:0 0 35px rgba(190,125,255,.42);transition:opacity .7s,transform .7s}
#memoryText small{display:block;margin-top:13px;color:rgba(194,158,255,.62);font:9px ui-monospace,monospace;letter-spacing:.12em}
#photoScene{padding:25px}
#photoCard{position:relative;max-width:88vw;max-height:72vh;display:grid;place-items:center;opacity:0;transform:scale(.97);filter:blur(7px);transition:opacity .8s,transform 4s ease,filter .8s}
#photoCard.show{opacity:1;filter:blur(0);transform:scale(1.025)}
#photoCard img{display:block;max-width:88vw;max-height:70vh;width:auto;height:auto;object-fit:contain;border-radius:14px;border:1px solid rgba(221,218,255,.22);box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 45px rgba(117,100,255,.14)}
#photoCaption{position:absolute;bottom:-28px;color:rgba(194,158,255,.62);font:8px ui-monospace,monospace;letter-spacing:.15em}
#quiet .label{position:absolute;top:18px;left:18px;color:rgba(205,174,255,.72);font:9px ui-monospace,monospace;letter-spacing:.18em}
#quiet .num{position:absolute;top:18px;right:18px;color:rgba(205,174,255,.72);font:9px ui-monospace,monospace;letter-spacing:.18em}
#quiet .q{max-width:86vw;text-align:center}
#quiet .q b{font-size:clamp(27px,7.5vw,55px);line-height:1.2;font-weight:500;text-shadow:0 0 28px rgba(167,151,255,.2)}
#ending{padding:20px}
#endingMain{position:relative;z-index:5;max-width:82vw;text-align:center;font-size:clamp(26px,7vw,52px);line-height:1.18;font-weight:500;color:#d9b8ff;text-shadow:0 0 35px rgba(190,125,255,.46)}
.floating{position:absolute;z-index:2;max-width:31vw;color:rgba(202,169,255,.62);font-size:clamp(9px,2.6vw,14px);line-height:1.25;text-align:center;pointer-events:none;animation:float 9s ease-in-out infinite alternate}
.floating.dim{color:rgba(181,145,235,.38);font-size:clamp(8px,2.1vw,11px)}
.floating.bright{color:rgba(224,190,255,.82);font-size:clamp(11px,3vw,17px)}
@keyframes float{to{transform:translate3d(var(--dx),var(--dy),0)}}
#end{padding:20px;text-align:center}
#end b{font-size:clamp(23px,6vw,48px);line-height:1.15;font-weight:500}
#end p{color:rgba(194,158,255,.62);font:9px ui-monospace,monospace;letter-spacing:.16em;margin-top:20px}
</style>
</head>
<body>
<div id="stars"><div class="nebula n1"></div><div class="nebula n2"></div></div>
<div id="app">
<section id="intro" class="scene active">
 <div class="top"><span>MEMORY ARCHIVE</span><span>ROOM_2238</span></div>
 <div><div class="title">ROOM_2238</div><div class="sub">a small room full of memories</div></div>
 <button id="enter">ENTER ROOM</button>
</section>
<section id="textScene" class="scene">
 <div class="top"><span>MEMORY / TEXT</span><span id="textNo">01</span></div>
 <div id="memoryText"></div>
</section>
<section id="photoScene" class="scene">
 <div class="top"><span>MEMORY / IMAGE</span><span id="photoNo">01</span></div>
 <div id="photoCard"><img id="memoryImg"><div id="photoCaption"></div></div>
</section>
<section id="quiet" class="scene">
 <div class="label">THE QUIET CHAPTER</div><div class="num">03</div>
 <div class="q"><b>Mungkin terlihat singkat, tetapi banyak kenangan di dalamnya.</b></div>
</section>
<section id="ending" class="scene"></section>
<section id="end" class="scene">
 <div><b>ROOM_2238</b><p>SESSION ENDED</p></div>
</section>
</div>
<audio id="audio" preload="auto" src="assets/audio/room-2238.mp3"></audio>
<script>
const DATA={"records": [{"id": 1, "file": "assets/ss/001.jpg"}, {"id": 2, "file": "assets/ss/002.jpg"}, {"id": 3, "file": "assets/ss/003.jpg"}, {"id": 4, "file": "assets/ss/004.jpg"}, {"id": 5, "file": "assets/ss/005.jpg"}, {"id": 6, "file": "assets/ss/006.jpg"}, {"id": 7, "file": "assets/ss/007.jpg"}, {"id": 8, "file": "assets/ss/008.jpg"}, {"id": 9, "file": "assets/ss/009.jpg"}, {"id": 10, "file": "assets/ss/010.jpg"}, {"id": 11, "file": "assets/ss/011.jpg"}, {"id": 12, "file": "assets/ss/012.jpg"}, {"id": 13, "file": "assets/ss/013.png"}, {"id": 14, "file": "assets/ss/014.jpg"}, {"id": 15, "file": "assets/ss/015.jpg"}, {"id": 16, "file": "assets/ss/016.jpg"}, {"id": 17, "file": "assets/ss/017.jpg"}, {"id": 18, "file": "assets/ss/018.jpg"}, {"id": 19, "file": "assets/ss/019.jpg"}, {"id": 20, "file": "assets/ss/020.jpg"}, {"id": 21, "file": "assets/ss/021.jpg"}, {"id": 22, "file": "assets/ss/022.jpg"}, {"id": 23, "file": "assets/ss/023.jpg"}, {"id": 24, "file": "assets/ss/024.jpg"}], "endingTexts": ["makasih banyak ya bang", "Om Kalo, terima kasih. Sekarang aku sudah punya selagam. Sehat selalu ya.", "terima kasih buat beberapa minggu terakhir semua", "Terimakasih semuanya sudah mau berpartisipasi menjadi juri, walaupun ada beberapa kekurangan yang penting kita udah nyoba oke.", "makasihhh jugaaa banggg udah buat acara kayak gini, seruuuu bangeettt", "makasi jg bang ud bikin gue ga kesepian", "okayy terimakasih juga abangg", "Terimakasih semuanya sudah mau berpartisipasi", "i hope you come back again", "aku juga sayang sama kalian semua ok", "hah sayang banget gw sama kalian semua co", "makan yang enak disana oke", "semogaa kita semuaa dipertemukann lagii yaa samaa bangg karouuu ok.", "semangat ok!", "makasih juga bang", "terima kasih semuanya sudah mau..."], "introTexts": ["auri inut semangat ospek.", "semangattt maba andalan gwehhh.", "jadi satpam yang baik dan benar ok.", "om kalo terimakasii, sekarang aku sudah punya selagam, sehat selalu ya.", "jadi maba yang baik dan benar ok. jangan lantam lantam x.", "7x7 dulu.", "cetingan sama muel aja ok.", "MksdLu Apa Anj Blu Jmbot.", "liya gamon juga?.", "juri baik dan keren.", "itu pasti setya.", "hah sayang banget gw sama kalian semua co.", "00:02 love you all.", "bg karou lu berjasa di hidup gua, walaupun hanya singgah sebentar."]};
const scenes=[...document.querySelectorAll('.scene')];
const audio=document.getElementById('audio');
let running=false;
function show(id){scenes.forEach(s=>s.classList.toggle('active',s.id===id))}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
for(let i=0;i<130;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s)}
async function textPhase(){
 show('textScene');
 const el=document.getElementById('memoryText');
 const texts=DATA.introTexts;
 for(let i=0;i<texts.length;i++){
  el.style.opacity=0;
  el.style.transform='translateY(14px) scale(.985)';
  await wait(1100);
  el.innerHTML='“'+texts[i]+'”<small>MEMORY TEXT</small>';
  document.getElementById('textNo').textContent=String(i+1).padStart(2,'0');
  el.style.opacity=1;
  el.style.transform='translateY(0) scale(1)';

  // Intro dibuat senyaman durasi SS: teks diberi waktu untuk dibaca,
  // lalu fade-out sebelum teks berikutnya masuk.
  const hold = i===texts.length-1 ? 6500 : 5200;
  await wait(hold);
  el.style.opacity=0;
  el.style.transform='translateY(-10px) scale(.985)';
  await wait(1200);
 }
}
async function photoPhase(){
 if(!DATA.records.length)return;
 show('photoScene'); const img=document.getElementById('memoryImg'),card=document.getElementById('photoCard'),cap=document.getElementById('photoCaption');
 for(let i=0;i<DATA.records.length;i++){
  card.classList.remove('show'); await wait(420);
  img.src=DATA.records[i].file;cap.textContent='MEMORY_'+String(DATA.records[i].id).padStart(3,'0');
  document.getElementById('photoNo').textContent=String(i+1).padStart(2,'0');
  await new Promise(res=>{img.onload=res;img.onerror=res});
  card.classList.add('show'); await wait(2550);
 }
}
function buildEnding(){
 const s=document.getElementById('ending'); s.innerHTML='';
 const main=document.createElement('div'); main.id='endingMain';
 main.innerHTML='Terima kasih untuk semua<br>member yang pernah ada.'; s.appendChild(main);
 const pool=DATA.endingTexts;
 // 16 slots: exactly 8 kiri + 8 kanan, balanced vertically.
 const slots=[
  [7,14,'dim',-1.2,1],[75,14,'dim',1.2,-1],
  [17,25,'bright',-1,2],[81,25,'bright',1,-2],
  [6,38,'dim',-1.2,-1],[76,38,'dim',1.2,1],
  [16,50,'bright',-1,-1],[82,50,'bright',1,1],
  [6,62,'dim',-1.2,1],[76,62,'dim',1.2,-1],
  [17,74,'bright',-1,1],[81,74,'bright',1,-1],
  [7,85,'dim',-1.2,-1],[75,85,'dim',1.2,1],
  [18,92,'bright',-1,0],[80,92,'bright',1,0]
 ];
 slots.forEach((sl,i)=>{
  const text=pool[i%pool.length];
  const d=document.createElement('div'); d.className='floating '+sl[2];
  d.textContent='“'+text+'”'; d.style.left=sl[0]+'%'; d.style.top=sl[1]+'%';
  d.style.setProperty('--dx',sl[3]+'vw'); d.style.setProperty('--dy',sl[4]+'vh');
  d.style.animationDelay=(i*.35)+'s'; s.appendChild(d);
 });
}
async function run(){
 if(running)return;running=true;
 document.getElementById('enter').style.display='none';
 audio.volume=.34;audio.play().catch(()=>{});
 await wait(900);await textPhase();await wait(3000);await photoPhase();
 show('quiet');await wait(5200);
 buildEnding();show('ending');await wait(8500);
 show('end');
}
document.getElementById('enter').addEventListener('click',run);
</script>
</body>
</html>
