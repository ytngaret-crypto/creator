<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><style>
:root{--bg:#080812;--fg:#f7f4ff;--muted:#aaa5ba;--accent:#d8b8ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{overflow-x:hidden}h1{font-size:clamp(48px,10vw,140px);line-height:.88;letter-spacing:-.065em;margin:18px 0;font-weight:600}
h2{font-size:clamp(32px,6vw,72px);line-height:.98;letter-spacing:-.045em;margin:0 0 18px}
p{font-size:clamp(16px,2.2vw,22px);line-height:1.65;color:#d9d4e4;max-width:760px}
.kicker{font:10px ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);padding:13px 20px;border-radius:999px;font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(14px)}
.gallery{display:grid;gap:18px}.gallery img{max-width:100%;display:block;width:100%;height:100%;object-fit:cover;border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.music{position:fixed;right:18px;bottom:18px;z-index:20;width:min(320px,calc(100vw - 36px));opacity:.92}.music audio{width:100%;height:38px}

.full{height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#37264e,transparent 35%),#08080d}.panel{height:100svh;display:none;place-items:center;padding:8vw;position:relative}.panel.active{display:grid}.center{position:relative;z-index:2;max-width:900px;text-align:center}.center p{margin:0 auto 28px}.orb{position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(222,185,255,.22),transparent 65%);filter:blur(12px);animation:pulse 5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.photoPanel{display:block;overflow:auto;padding:8vw}.photoPanel .gallery{grid-template-columns:repeat(2,1fr);margin:auto;max-width:1100px}.photoPanel .gallery img{height:38vw;max-height:520px}.hint{text-align:center;color:var(--muted);font:10px ui-monospace}@media(max-width:700px){.photoPanel .gallery{grid-template-columns:1fr}.photoPanel .gallery img{height:72vw}}
</style></head><body><div class="full"><section class="panel active"><div class="orb"></div><div class="center"><div class="kicker">Memory / 01</div><h1>{{title}}</h1><p>{{subtitle}}</p><button class="btn" onclick="next()">Continue</button></div></section>
<section class="panel"><div class="center"><div class="kicker">02 / FIRST WORDS</div><h2>{{intro1}}</h2><p>{{intro2}}</p><button class="btn" onclick="next()">Next</button></div></section>
<section class="panel"><div class="center"><div class="kicker">03 / THE STORY</div><h2>{{intro3}}</h2><p>{{intro4}}</p><button class="btn" onclick="next()">Next</button></div></section>
<section class="panel photoPanel"><div class="gallery">{{gallery}}</div><p class="hint">Explore the archive</p><button class="btn" onclick="next()">Continue</button></section>
<section class="panel"><div class="center"><div class="kicker">05 / QUIET</div><h2>{{chapter}}</h2><p>{{closing}}</p><button class="btn" onclick="next()">Finish</button></div></section>
<section class="panel"><div class="center"><div class="kicker">THE END</div><h2>{{title}}</h2><p>{{closing}}</p></div></section></div><div class="music"><audio id="bgAudio" controls preload="metadata" src="{{music}}"></audio></div><script>
const audio=document.getElementById('bgAudio');
function start(){if(audio&&audio.src)audio.play().catch(()=>{});}
function next(){const p=[...document.querySelectorAll('.panel')],i=p.findIndex(x=>x.classList.contains('active'));if(i>=0&&i<p.length-1){p[i].classList.remove('active');p[i+1].classList.add('active');start();}}
</script></body></html>
