<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><style>
:root{--bg:#080812;--fg:#f7f4ff;--muted:#aaa5ba;--accent:#d8b8ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
body{overflow-x:hidden}h1{font-size:clamp(48px,10vw,140px);line-height:.88;letter-spacing:-.065em;margin:18px 0;font-weight:600}
h2{font-size:clamp(32px,6vw,72px);line-height:.98;letter-spacing:-.045em;margin:0 0 18px}
p{font-size:clamp(16px,2.2vw,22px);line-height:1.65;color:#d9d4e4;max-width:760px}
.kicker{font:10px ui-monospace,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);padding:13px 20px;border-radius:999px;font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(14px)}
.gallery{display:grid;gap:18px}.gallery img{max-width:100%;display:block;width:100%;height:100%;object-fit:cover;border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.28)}
.music{position:fixed;right:18px;bottom:18px;z-index:20;width:min(320px,calc(100vw - 36px));opacity:.92}.music audio{width:100%;height:38px}

.scroll{background:#f1ede5;color:#16131b}.scroll .kicker{color:#746d78}.scroll header{min-height:88svh;padding:10vw;display:grid;align-content:end;background:linear-gradient(135deg,#e8ddff,#f6f0e6 55%,#ddd0f1)}.scroll p{color:#57515d}
.chapter{min-height:90vh;padding:14vw 12vw;display:grid;align-content:center;max-width:1100px}.chapter span{font:12px ui-monospace;color:#817989;margin-bottom:24px}.chapter.dark{max-width:none;background:#17131e;color:#f5efff}.chapter.dark p{color:#bdb5c8}
.archive{padding:10vw 8vw}.archive>.kicker{margin-bottom:30px}.archive .gallery{grid-template-columns:repeat(2,1fr);grid-auto-rows:32vw}.archive img:nth-child(3n){transform:translateY(10vw)}
.scroll footer{padding:18vw 10vw;text-align:center;background:#d9c8f0}@media(max-width:700px){.archive .gallery{grid-template-columns:1fr;grid-auto-rows:auto}.archive img:nth-child(3n){transform:none}}
</style></head><body><div class="scroll"><header><div class="kicker">Birthday / JOURNAL</div><h1>{{title}}</h1><p>{{subtitle}}</p></header>
<main><article class="chapter"><span>01</span><h2>{{intro1}}</h2><p>{{intro2}}</p></article>
<article class="chapter dark"><span>02</span><h2>{{intro3}}</h2><p>{{intro4}}</p></article>
<section class="archive"><div class="kicker">MEMORY WALL</div><div class="gallery">{{gallery}}</div></section>
<article class="chapter"><span>03</span><h2>{{chapter}}</h2><p>{{closing}}</p></article></main>
<footer><div class="kicker">END OF CHAPTER</div><h2>{{title}}</h2></footer></div><div class="music"><audio id="bgAudio" controls preload="metadata" src="{{music}}"></audio></div><script>
const audio=document.getElementById('bgAudio');
function start(){if(audio&&audio.src)audio.play().catch(()=>{});}
function next(){const p=[...document.querySelectorAll('.panel')],i=p.findIndex(x=>x.classList.contains('active'));if(i>=0&&i<p.length-1){p[i].classList.remove('active');p[i+1].classList.add('active');start();}}
</script></body></html>
